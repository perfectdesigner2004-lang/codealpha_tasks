<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — CodeAlpha</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <span>frames.</span>
  </div>
  <p class="tagline">a small visual collection</p>
</header>

<nav class="filters" id="filters">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="nature">Nature</button>
  <button class="filter-btn" data-filter="architecture">Architecture</button>
  <button class="filter-btn" data-filter="travel">Travel</button>
  <button class="filter-btn" data-filter="animals">Animals</button>
</nav>

<main class="gallery" id="gallery"></main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">&times;</button>
  <button class="lb-nav lb-prev" id="lbPrev">&#10094;</button>
  <div class="lb-content">
    <img id="lbImage" src="" alt="">
    <p class="lb-caption" id="lbCaption"></p>
  </div>
  <button class="lb-nav lb-next" id="lbNext">&#10095;</button>
</div>

<script src="script.js"></script>
</body>
</html>
